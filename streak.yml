name: Update GitHub Streak Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          path: profile/streak.svg
          options: >-
            user=devimatsa07
            theme=nord
            border=9b59b6
            ring=9b59b6
            fire=9b59b6
            currStreakLabel=9b59b6
            sideLabels=9b59b6
            currStreakNum=ffffff
            sideNums=ffffff
            dates=9b59b6
            timezone=Asia/Kolkata
            locale=en
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Streak Card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update GitHub streak stats" || exit 0
          git push
